# @package optimization
defaults:
  - _self_

seed: 0
loss_type: "flow"
loss_scale: 0.1
norm_type: "l2" # "l1", "l2", "smooth_l1"
lr: 1e-4
weight_decay: 1e-5
num_steps: 1
sample_mode: "zero"
t_two_step: 0.9
discrete_dt: 0.01
grad_clip_norm: 10.0
ema_rate: 0.995
# progressive-EMA / optimizer fields (must exist here for hydra struct mode;
# dp_harness overrides them, plain runs keep these defaults = old behavior)
ema_power: 0.0
ema_inv_gamma: 1.0
ema_max: 0.9999
ema_min: 0.0
adam_beta1: 0.9
adam_beta2: 0.999
batch_size: 1024
gradient_steps: 300000
warmup_ratio: 0.2
rampup_ratio: 0.5
min_value: 0.0
max_value: 1.0
model_path: null
interp_type: "linear"
device: "cuda"
use_compile: false
compile_mode: null # Compile mode: null, "default", "reduce-overhead", "max-autotune"
use_cudagraphs: false # Whether to use CUDA graphs (requires static shapes)
auto_resume: true
cauchy_c: 0.2
student_t_df: 2.0
xm_k: 4
nu_cond_reg: 0.01
nu_cond_warmup: 30000
