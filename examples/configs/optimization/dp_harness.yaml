# @package optimization
# T12 recipe + the Diffusion-Policy tricks worth importing (PART CDXLIX audit):
#   * progressive power-law EMA (their EMAModel: power 0.75, cap 0.9999) in
#     place of our constant 0.995 -- averaging window grows from ~30 steps to
#     ~10k, which is what stabilises their last-5/last-15;
#   * AdamW betas (0.9, 0.95) and weight decay 1e-3, their transformer values.
# Everything else is unchanged from optimization/default.yaml.
defaults:
  - default
  - _self_

ema_power: 0.75
ema_inv_gamma: 1.0
ema_max: 0.9999
ema_min: 0.0

adam_beta1: 0.9
adam_beta2: 0.95

weight_decay: 1e-3
