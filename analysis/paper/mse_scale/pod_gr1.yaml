apiVersion: v1
kind: Pod
metadata:
  name: yuchen-msescale-gr1-v4
  labels:
    app: mse-stage-scale
    owner: yuchen
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 7200
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export PYTHONPATH=/mnt/pfs/yuchen/groot/Isaac-GR00T:${PYTHONPATH:-}
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1
          export HF_DATASETS_OFFLINE=1 PYTHONUNBUFFERED=1 MUJOCO_GL=egl
          export OMP_NUM_THREADS=4 TOKENIZERS_PARALLELISM=false
          /mnt/pfs/yuchen/groot/Isaac-GR00T/.venv/bin/python /mnt/pfs/yuchen/mse_stage_scale_20260904/probe_mse_stage_scale_v4.py gr1 \
            --out /mnt/pfs/yuchen/mse_stage_scale_20260904 --batch 2 \
            2>&1 | tee /mnt/pfs/yuchen/mse_stage_scale_20260904/gr1-v4.log
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: pfs
          mountPath: /mnt/pfs
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: pfs
      persistentVolumeClaim:
        claimName: main-pfs-pvc
    - name: dshm
      emptyDir:
        medium: Memory
