apiVersion: v1
kind: Pod
metadata:
  name: yuchen-robomimic-groot-adapter-0907
  labels: {app: robomimic-groot-adapter, owner: yuchen}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc, "sleep 14400"]
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
        - {name: HTTPS_PROXY, value: "http://172.17.0.12:2080"}
        - {name: HTTP_PROXY, value: "http://172.17.0.12:2080"}
        - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local"}
      resources:
        requests: {cpu: '16', memory: 96Gi, nvidia.com/gpu: '1'}
        limits: {cpu: '16', memory: 96Gi, nvidia.com/gpu: '1'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory}
