apiVersion: v1
kind: Pod
metadata:
  name: yuchen-ams-eval-pi05
  labels: {app: action-mag-specialist-eval, owner: yuchen, stack: pi05}
spec:
  restartPolicy: Never
  nodeName: 172.17.0.18
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: ["bash", "-lc"]
      args:
        - |
          set -euo pipefail
          root=/mnt/pfs/yuchen/action_mag_specialists_20260905
          export HF_HOME=/mnt/pfs/yuchen/hf_home
          export HF_HUB_OFFLINE=1
          export TRANSFORMERS_OFFLINE=1
          export LIBERO_CONFIG_PATH=/mnt/pfs/yuchen/oft/libero_cfg
          export PYTHONPATH=/mnt/pfs/yuchen/pi05/lerobot_src/src
          export PYTHONUNBUFFERED=1
          mkdir -p "$root/results" "$root/eval_logs"
          for bin in 0 1 2 3 4; do
            /mnt/pfs/yuchen/pi05/venv/bin/python \
              "$root/scripts/evaluate_specialists.py" pi05 \
              --bin "$bin" --batch 4 --per-task 40 \
              --output "$root/results/pi05_q${bin}.npz" \
              2>&1 | tee "$root/eval_logs/pi05_q${bin}.log"
          done
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
      resources:
        requests: {cpu: "24", memory: 128Gi, nvidia.com/gpu: "1"}
        limits: {cpu: "24", memory: 128Gi, nvidia.com/gpu: "1"}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory}
