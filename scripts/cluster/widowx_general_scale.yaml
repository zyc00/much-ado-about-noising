apiVersion: v1
kind: Pod
metadata:
  name: yuchen-widowx-general-scale
  labels: {app: heterogeneous-scale-probe, owner: yuchen}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export PATH="$PWD/.venv/bin:$PATH"
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export PYTHONUNBUFFERED=1 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          torchrun --standalone --nproc_per_node=4 /mnt/pfs/yuchen/widowx_general_scale_20260906/probe_widowx_general_scale.py --output /mnt/pfs/yuchen/widowx_general_scale_20260906/raw
      resources:
        requests: {cpu: '16', memory: 120Gi, nvidia.com/gpu: '4'}
        limits: {cpu: '16', memory: 120Gi, nvidia.com/gpu: '4'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory}
