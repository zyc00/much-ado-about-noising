apiVersion: v1
kind: Pod
metadata:
  name: yuchen-bridge-hg40-0908
  labels: {app: bridge-hg-tail-probe, owner: yuchen}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
              - key: kubernetes.io/hostname
                operator: In
                values: ['172.17.0.21']
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=2 NO_ALBUMENTATIONS_UPDATE=1
          probe_dir=/mnt/pfs/yuchen/bridge_hg40_20260908
          .venv/bin/python "$probe_dir/code/probe_bridge_hg_many_tasks.py" --output "$probe_dir/raw" --prepare-only
          CUDA_VISIBLE_DEVICES=0 .venv/bin/python "$probe_dir/code/probe_bridge_hg_many_tasks.py" \
            --output "$probe_dir/raw" --rank 0 --world-size 2 > "$probe_dir/rank0.log" 2>&1 &
          probe_pid0=$!
          CUDA_VISIBLE_DEVICES=1 .venv/bin/python "$probe_dir/code/probe_bridge_hg_many_tasks.py" \
            --output "$probe_dir/raw" --rank 1 --world-size 2 > "$probe_dir/rank1.log" 2>&1 &
          probe_pid1=$!
          wait "$probe_pid0"
          wait "$probe_pid1"
          echo BRIDGE_HG40_DONE
      resources:
        requests: {cpu: '16', memory: 64Gi, nvidia.com/gpu: '2'}
        limits: {cpu: '16', memory: 64Gi, nvidia.com/gpu: '2'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 12Gi}
