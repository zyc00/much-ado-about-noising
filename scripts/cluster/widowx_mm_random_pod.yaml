apiVersion: v1
kind: Pod
metadata:
  name: yuchen-wxmm-random
  labels:
    app: widowx-mm-probe
    owner: yuchen
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: ["bash", "-lc"]
      args:
        - |
          set -o pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export HF_HOME=/mnt/pfs/yuchen/hf_home
          export PYTHONUNBUFFERED=1
          SOURCE=rollout N_SCREEN=1000 K_SCREEN=8 K_DISCOVERY=32 K_CONFIRM=64 \
            DRAW_BATCH=8 N_NULL=5000 N_RANDOM_DEEP=100 RANDOM_ONLY=1 \
            OUT=/mnt/pfs/yuchen/groot/widowx_mm_rollout_random_v1 \
            .venv/bin/python /mnt/pfs/yuchen/groot/probe_widowx_multimodality.py \
            2>&1 | tee /mnt/pfs/yuchen/groot/widowx_mm_rollout_random_v1.log
      env:
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        - name: HTTP_PROXY
          value: http://172.17.0.12:2080
        - name: HTTPS_PROXY
          value: http://172.17.0.12:2080
        - name: http_proxy
          value: http://172.17.0.12:2080
        - name: https_proxy
          value: http://172.17.0.12:2080
        - name: NO_PROXY
          value: localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16
        - name: no_proxy
          value: localhost,127.0.0.1,.svc,.cluster.local,10.0.0.0/8,192.168.0.0/16
      resources:
        requests:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 64Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: pfs
          mountPath: /mnt/pfs
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: pfs
      persistentVolumeClaim:
        claimName: main-pfs-pvc
    - name: dshm
      emptyDir:
        medium: Memory
