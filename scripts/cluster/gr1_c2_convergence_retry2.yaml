apiVersion: batch/v1
kind: Job
metadata:
  name: yuchen-gr1c2-convergence-retry2
  labels:
    app: gr1-c2-convergence-retry2
    owner: yuchen
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimitPerIndex: 1
  maxFailedIndexes: 1
  template:
    metadata:
      labels:
        app: gr1-c2-convergence-retry2
        owner: yuchen
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: aihc.baidu.com/dedicated-pool
                    operator: DoesNotExist
      containers:
        - name: eval
          image: zyc00/easypod:latest
          imagePullPolicy: Always
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              case "${JOB_COMPLETION_INDEX}" in
                0) shard=1; env_name="gr1_unified/PnPMilkToMicrowaveClose_GR1ArmsAndWaistFourierHands_Env" ;;
                1) shard=7; env_name="gr1_unified/PosttrainPnPNovelFromTrayToPotSplitA_GR1ArmsAndWaistFourierHands_Env" ;;
                *) echo "invalid retry index"; exit 2 ;;
              esac
              exec bash /mnt/pfs/yuchen/groot/gr1_eval_pod_ready.sh \
                /mnt/pfs/yuchen/groot/ft_gr1c2/checkpoint-56000 \
                gr1c2nu4d-56000-retry "${shard}" "${env_name}"
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: all
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: pfs
              mountPath: /mnt/pfs
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: pfs
          persistentVolumeClaim:
            claimName: main-pfs-pvc
        - name: dshm
          emptyDir:
            medium: Memory
