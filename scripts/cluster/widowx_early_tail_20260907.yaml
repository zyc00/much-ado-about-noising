apiVersion: v1
kind: Pod
metadata:
  name: yuchen-wx-early-tail-0907
  labels: {app: widowx-early-tail, owner: yuchen}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export PYTHONPATH="$PWD:/mnt/pfs/yuchen/groot/early_tail_20260907"
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export GROOT_ROPE_CACHE=1 PYTHONUNBUFFERED=1 NO_ALBUMENTATIONS_UPDATE=1
          .venv/bin/python /mnt/pfs/yuchen/groot/early_tail_20260907/probe_widowx_early_tail.py \
            --checkpoint /mnt/pfs/yuchen/groot/ft_wxht10k/checkpoint-2000 \
            --reference /mnt/pfs/yuchen/widowx_general_scale_20260906/raw \
            --output /mnt/pfs/yuchen/groot/early_tail_20260907/results \
            2>&1 | tee /mnt/pfs/yuchen/groot/early_tail_20260907/probe.log
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
      resources:
        requests: {cpu: '8', memory: 64Gi, nvidia.com/gpu: '1'}
        limits: {cpu: '8', memory: 64Gi, nvidia.com/gpu: '1'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory}
