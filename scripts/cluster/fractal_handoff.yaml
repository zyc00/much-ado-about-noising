apiVersion: v1
kind: Pod
metadata:
  name: yuchen-fractal-handoff-0908-r3
  labels: {owner: yuchen, app: fractal-handoff}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export GROOT_ROPE_CACHE=1 PYTHONUNBUFFERED=1 OMP_NUM_THREADS=2
          export MUJOCO_GL=egl PYOPENGL_PLATFORM=egl
          probe_root=/mnt/pfs/yuchen/fractal_handoff_20260908
          sim_python=gr00t/eval/sim/SimplerEnv/simpler_uv/.venv/bin/python
          for method in ht flow flow_zero; do
            checkpoint=/mnt/pfs/yuchen/groot/ft_fr_flow/checkpoint-20000
            export GROOT_FLOW_NOISE_SCALE=1
            if [ "$method" = ht ]; then checkpoint=/mnt/pfs/yuchen/groot/ft_fr_nu224/checkpoint-20000; fi
            if [ "$method" = flow_zero ]; then export GROOT_FLOW_NOISE_SCALE=0; fi
            .venv/bin/python "$probe_root/code/serve_fractal_handoff.py" --checkpoint "$checkpoint" > "$probe_root/server_$method.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 120); do
              if rg -q 'Server is ready|Listening|serving' "$probe_root/server_$method.log"; then break; fi
              kill -0 "$server_pid"
              sleep 2
            done
            if [ "$method" = ht ]; then
              "$sim_python" "$probe_root/code/probe_fractal_handoff.py" --root "$probe_root" --phase collect --episodes 10
            fi
            "$sim_python" "$probe_root/code/probe_fractal_handoff.py" --root "$probe_root" --phase "$method" --episodes 10
            kill "$server_pid"
            wait "$server_pid" || true
            trap - EXIT
          done
          "$sim_python" "$probe_root/code/summarize_fractal_handoff.py" --root "$probe_root"
          echo HANDOFF_COMPLETE
      resources:
        requests: {cpu: '4', memory: 48Gi, nvidia.com/gpu: '1'}
        limits: {cpu: '4', memory: 48Gi, nvidia.com/gpu: '1'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
