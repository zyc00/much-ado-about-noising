apiVersion: v1
kind: Pod
metadata:
  name: yuchen-ht-sigma-context-0908
  labels: {owner: yuchen, app: ht-sigma-context}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export PATH="$PWD/.venv/bin:$PATH"
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=2
          export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
          probe_root=/mnt/pfs/yuchen/ht_sigma_context_20260908
          python "$probe_root/code/probe_ht_sigma_context.py" --dataset gr1 --output "$probe_root/gr1"
          python "$probe_root/code/probe_ht_sigma_context.py" --dataset bridge --output "$probe_root/bridge"
          python "$probe_root/code/probe_ht_sigma_context.py" --dataset fractal --output "$probe_root/fractal"
          echo ALL_SIGMA_CONTEXT_DONE
      resources:
        requests: {cpu: '6', memory: 48Gi, nvidia.com/gpu: '1'}
        limits: {cpu: '6', memory: 48Gi, nvidia.com/gpu: '1'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 16Gi}
