apiVersion: v1
kind: Pod
metadata:
  name: yuchen-fr-nu14-gaussaux1-seeded-eval-0909
  labels: {owner: yuchen, app: nu14-gaussian-aux-eval}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          root=/mnt/pfs/yuchen/groot
          run_dir="$root/ft_fr_nu14_gaussaux1_fresh_20260908"
          cd "$root/Isaac-GR00T"
          export PATH="$PWD/.venv/bin:$PATH"
          export PYTHONPATH="$PWD:$run_dir/audit"
          export HF_HOME=/mnt/pfs/yuchen/hf_home
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 WANDB_MODE=disabled
          export GROOT_ROPE_CACHE=1 PYTHONUNBUFFERED=1 NO_ALBUMENTATIONS_UPDATE=1
          export OMP_NUM_THREADS=2
          "$PWD/.venv/bin/python" "$run_dir/audit/nu_recipe_fork_eval.py" \
            --run-dir "$run_dir" --step 20000 --protocol paired \
            --gpus 0,1,2,3,4,5 \
            2>&1 | tee "$run_dir/eval-20000-seed1234-matched-nu224.log"
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
        - {name: NO_PROXY, value: 'localhost,127.0.0.1,.svc,.cluster.local'}
      resources:
        requests: {cpu: '48', memory: 192Gi, nvidia.com/gpu: '6'}
        limits: {cpu: '48', memory: 192Gi, nvidia.com/gpu: '6'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 24Gi}
