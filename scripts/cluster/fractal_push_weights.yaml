apiVersion: v1
kind: Pod
metadata:
  name: yuchen-fractal-push-weights-0908
  labels: {owner: yuchen, app: fractal-push-weights}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args:
        - |
          set -euo pipefail
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          export PYTHONUNBUFFERED=1 OMP_NUM_THREADS=2
          probe_root=/mnt/pfs/yuchen/fractal_push_weights_20260908
          .venv/bin/python "$probe_root/code/probe_fractal_push_weights.py" --output "$probe_root"
          .venv/bin/python "$probe_root/code/analyze_fractal_push_weights.py" --root "$probe_root"
      resources:
        requests: {cpu: '4', memory: 48Gi, nvidia.com/gpu: '1'}
        limits: {cpu: '4', memory: 48Gi, nvidia.com/gpu: '1'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
