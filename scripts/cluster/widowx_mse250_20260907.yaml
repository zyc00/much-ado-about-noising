apiVersion: v1
kind: Pod
metadata:
  name: yuchen-wx-mse250-tail-0907
  labels: {app: widowx-mse250-tail, owner: yuchen}
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: aihc.baidu.com/dedicated-pool
                operator: DoesNotExist
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: [bash, -lc]
      args: ["bash /mnt/pfs/yuchen/groot/mse250_tail_20260907/widowx_mse250_run.sh"]
      env:
        - {name: NVIDIA_DRIVER_CAPABILITIES, value: all}
        - {name: HTTPS_PROXY, value: "http://172.17.0.12:2080"}
        - {name: HTTP_PROXY, value: "http://172.17.0.12:2080"}
        - {name: NO_PROXY, value: "localhost,127.0.0.1,.svc,.cluster.local"}
      resources:
        requests: {cpu: '96', memory: 768Gi, nvidia.com/gpu: '8'}
        limits: {cpu: '96', memory: 768Gi, nvidia.com/gpu: '8'}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory}
