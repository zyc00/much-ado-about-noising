apiVersion: v1
kind: Pod
metadata:
  name: yuchen-hetero-scatter-gr1-k32
  labels: {app: hetero-scatter, owner: yuchen}
spec:
  restartPolicy: Never
  nodeName: 172.17.0.18
  containers:
    - name: main
      image: zyc00/easypod:latest
      command: ["bash", "-lc"]
      args:
        - >-
          cd /mnt/pfs/yuchen/groot/Isaac-GR00T &&
          export PATH="$PWD/.venv/bin:$PATH" &&
          export HF_HOME=/mnt/pfs/yuchen/hf_home HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          PYTHONUNBUFFERED=1 PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True &&
          torchrun --standalone --nproc_per_node=4
          /mnt/pfs/yuchen/hetero_scatter_20260906/probe_mse_flow_heteroscedasticity.py gr1 --k 32
          --output /mnt/pfs/yuchen/hetero_scatter_20260906/parts_k32
      resources:
        requests: {cpu: "40", memory: 300Gi, nvidia.com/gpu: "4"}
        limits: {cpu: "40", memory: 300Gi, nvidia.com/gpu: "4"}
      volumeMounts:
        - {name: pfs, mountPath: /mnt/pfs}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: pfs
      persistentVolumeClaim: {claimName: main-pfs-pvc}
    - name: dshm
      emptyDir: {medium: Memory}
